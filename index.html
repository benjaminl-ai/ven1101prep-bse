<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VEN1101 Prep Task Helper</title>
    <style>
        :root { 
            --yt-red: #ff0000; --yt-black: #0f0f0f; --yt-grey: #606060; --yt-white: #ffffff;
            --primary: #ef233c; --dark: #2b2d42; --glass: rgba(255,255,255,0.6); 
            --shop-bg: #f8f1e5; --success: #38b000; 
        }
        body { font-family: "Roboto", Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 0; }
        
        /* Navigation */
        header { background: var(--yt-white); padding: 12px; border-bottom: 1px solid #e5e5e5; text-align: center; position: sticky; top: 0; z-index: 1000; }
        .logo { color: var(--yt-red); font-weight: bold; font-size: 1.2rem; }
        .sub-header { color: var(--yt-black); font-size: 0.85rem; display: block; margin-top: 4px; }
        
        .nav-tabs { display: flex; background: white; border-bottom: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; cursor: pointer; color: var(--yt-grey); border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--yt-red); border-bottom-color: var(--yt-red); }

        .container { padding: 15px; max-width: 500px; margin: 0 auto; display: none; }
        .container.active { display: block; }

        /* Wiring a Plug Styles */
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .img-placeholder { width: 100%; height: 150px; background: #eee; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; color: #999; font-size: 0.8rem; border: 2px dashed #ccc; }
        textarea { width: 100%; height: 60px; border: 1px solid #ccc; border-radius: 8px; padding: 8px; box-sizing: border-box; font-size: 0.9rem; margin-bottom: 10px; }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { padding: 10px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-listen { background: #f2f2f2; color: #333; }
        .btn-record { background: var(--yt-black); color: white; }
        .btn-record.recording { background: var(--yt-red) !important; animation: pulse 1s infinite; }

        /* Troubleshooting Gacha Styles (Integrated) */
        #troubleshooting { background: var(--shop-bg); min-height: 90vh; text-align: center; }
        .shop-banner { background: #d90429; color: white; padding: 8px; font-weight: bold; letter-spacing: 2px; }
        .gacha-machine { width: 200px; height: 260px; display: flex; flex-direction: column; align-items: center; position: relative; margin: 20px auto; }
        .machine-top { width: 170px; height: 115px; background: var(--glass); border: 6px solid var(--dark); border-radius: 60px 60px 10px 10px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px; gap: 2px; }
        .machine-body { width: 190px; height: 115px; background: var(--primary); border: 6px solid var(--dark); border-top: none; border-radius: 0 0 20px 20px; position: relative; }
        .knob { width: 50px; height: 50px; background: #fff; border: 5px solid var(--dark); border-radius: 50%; margin: 10px auto; position: relative; cursor: pointer; transition: transform 0.4s; }
        .knob::after { content: ''; position: absolute; width: 30px; height: 8px; background: var(--dark); top: 16px; left: 5px; border-radius: 4px; }
        .knob.spin { transform: rotate(180deg); }
        .capsule { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #333; }
        .out-capsule { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--dark); position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); display: none; z-index: 10; }
        #recordBtnGacha { background: var(--success); color: white; border: none; padding: 14px 30px; border-radius: 35px; font-size: 1rem; cursor: pointer; display: none; margin: 10px auto; font-weight: bold; }

        /* Shared Modal */
        #modalOverlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: white; padding: 25px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <div class="logo">🔴 VEN1101 Prep Task Helper (BSE)</div>
</header>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab(0)">Wiring a Plug</button>
    <button class="tab-btn" onclick="switchTab(1)">Troubleshooting</button>
</div>

<div id="wiring" class="container active">
    <div class="card">
        <div class="img-placeholder">PHOTO 1: Remove Outer Insulation</div>
        <textarea id="w1" placeholder="First, remove the outer insulation of the cable..."></textarea>
        <div class="btn-row">
            <button class="btn btn-listen" onclick="speak('w1')">🔊 Listen</button>
            <button class="btn btn-record" id="rw1" onclick="handleRecord('w1', 'rw1')">🎤 Record</button>
        </div>
    </div>

    <div class="card">
        <div class="img-placeholder">PHOTO 2: Strip Wire Ends</div>
        <textarea id="w2" placeholder="Then, strip the insulation from the end of the three wires..."></textarea>
        <div class="btn-row">
            <button class="btn btn-listen" onclick="speak('w2')">🔊 Listen</button>
            <button class="btn btn-record" id="rw2" onclick="handleRecord('w2', 'rw2')">🎤 Record</button>
        </div>
    </div>

    <div class="card">
        <div class="img-placeholder">PHOTO 3: Connect Wires to Terminals</div>
        <textarea id="w3" placeholder="Connect the brown wire to the live terminal and blue to neutral..."></textarea>
        <div class="btn-row">
            <button class="btn btn-listen" onclick="speak('w3')">🔊 Listen</button>
            <button class="btn btn-record" id="rw3" onclick="handleRecord('w3', 'rw3')">🎤 Record</button>
        </div>
    </div>

    <div class="card">
        <div class="img-placeholder">PHOTO 4: Tighten Cord Grip</div>
        <textarea id="w4" placeholder="Finally, tighten the cord grip and put the cover back on..."></textarea>
        <div class="btn-row">
            <button class="btn btn-listen" onclick="speak('w4')">🔊 Listen</button>
            <button class="btn btn-record" id="rw4" onclick="handleRecord('w4', 'rw4')">🎤 Record</button>
        </div>
    </div>
</div>

<div id="troubleshooting" class="container">
    <div class="shop-banner">ガシャポン GACHAPON TOKYO</div>
    <div style="padding: 10px; font-size: 0.8rem; background: #2b2d42; color: white;">
        1. Twist Knob | 2. Listen Question | 3. Record Answer
    </div>

    <div class="gacha-machine">
        <div class="machine-top" id="capsuleContainer"></div>
        <div class="machine-body">
            <div class="knob" id="knob"></div>
        </div>
        <div id="outCapsule" class="out-capsule"></div>
    </div>

    <button id="recordBtnGacha">🎤 Answer / 錄音回答</button>
    
    <div style="background:white; margin: 15px; padding: 10px; border-radius: 8px; text-align: left; font-size: 0.85rem;">
        <b style="color:red">Study List:</b>
        <ul id="studyList" style="padding-left: 20px; margin: 5px 0;"></ul>
    </div>
</div>

<div id="modalOverlay">
    <div class="modal">
        <h2 id="mT">Perfect!</h2>
        <p id="mM"></p>
        <button onclick="document.getElementById('modalOverlay').style.display='none'" style="padding:10px 30px; border-radius:20px; border:none; background:#333; color:white; font-weight:bold;">Close</button>
    </div>
</div>

<script>
    let currentRec = null;
    let activeId = "";

    // Tab Switching
    function switchTab(idx) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.container')[idx].classList.add('active');
        document.querySelectorAll('.tab-btn')[idx].classList.add('active');
        if (currentRec) stopRec();
    }

    // Common TTS
    function speak(textOrId) {
        window.speechSynthesis.cancel();
        const text = document.getElementById(textOrId) ? document.getElementById(textOrId).value : textOrId;
        const m = new SpeechSynthesisUtterance(text);
        m.lang = 'en-US'; m.rate = 0.85;
        window.speechSynthesis.speak(m);
    }

    // --- WIRING A PLUG LOGIC ---
    function handleRecord(id, btnId) {
        const btn = document.getElementById(btnId);
        if (btn.classList.contains('recording')) { stopRec(); return; }
        if (currentRec) stopRec();
        activeId = id;
        startRec(btnId);
    }

    function startRec(btnId) {
        const btn = document.getElementById(btnId);
        const Rec = window.webkitSpeechRecognition || window.SpeechRecognition;
        if (!Rec) return alert("Browser not supported");

        currentRec = new Rec();
        currentRec.lang = 'en-US';
        currentRec.continuous = true;
        btn.classList.add('recording');
        btn.innerHTML = "🛑 Finish";

        currentRec.onresult = (e) => {
            const heard = e.results[e.results.length-1][0].transcript;
            validate(heard);
        };
        currentRec.onend = () => stopRec();
        currentRec.start();
    }

    function stopRec() {
        if (currentRec) { currentRec.stop(); currentRec = null; }
        document.querySelectorAll('.btn-record').forEach(b => {
            b.classList.remove('recording');
            b.innerHTML = "🎤 Record";
        });
        document.getElementById('recordBtnGacha').classList.remove('recording');
        document.getElementById('recordBtnGacha').innerText = "🎤 Answer / 錄音回答";
    }

    function validate(heard) {
        const target = document.getElementById(activeId).value.toLowerCase().replace(/[^\w\s]/gi, '');
        const spoken = heard.toLowerCase();
        const keywords = target.split(" ").filter(w => w.length > 3);
        let matches = 0;
        keywords.forEach(w => { if(spoken.includes(w)) matches++; });

        const isGood = keywords.length === 0 || (matches / keywords.length) >= 0.5;
        
        document.getElementById('mT').innerText = isGood ? "🌟 Excellent!" : "⚠️ Try Again";
        document.getElementById('mM').innerHTML = isGood ? 
            `You nailed it! <br><br> <span style="color:green">"Heard: ${heard}"</span>` : 
            `Oops! Try to speak clearer. <br><br> <span style="color:red">"Heard: ${heard}"</span>`;
        document.getElementById('modalOverlay').style.display = 'flex';
        if (isGood) speak("Excellent! Well done.");
    }

    // --- TROUBLESHOOTING GACHA LOGIC ---
    const QA = [
        { q: "the machine overheats", a: "let it cool down" },
        { q: "the machine stops working", a: "check the power supply" },
        { q: "there is a jammed paper", a: "pull it out gently" },
        { q: "there is a strange noise", a: "turn off the shredder" }
    ];

    const capsuleColors = ['#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#bdb2ff', '#ffc6ff'];
    const capContainer = document.getElementById('capsuleContainer');
    for (let i = 0; i < 12; i++) {
        const cap = document.createElement('div');
        cap.className = 'capsule';
        cap.style.backgroundColor = capsuleColors[i % 8];
        capContainer.appendChild(cap);
    }

    const sList = document.getElementById('studyList');
    QA.forEach(item => {
        const li = document.createElement('li');
        li.innerText = `If ${item.q}, ${item.a}`;
        sList.appendChild(li);
    });

    let currentA = "";
    const knob = document.getElementById('knob');
    const outCap = document.getElementById('outCapsule');
    const recGacha = document.getElementById('recordBtnGacha');

    knob.onclick = () => {
        recGacha.style.display = "none";
        outCap.style.display = "none";
        knob.classList.add('spin');
        setTimeout(() => {
            knob.classList.remove('spin');
            outCap.style.background = capsuleColors[Math.floor(Math.random()*8)];
            outCap.style.display = "block";
            const task = QA[Math.floor(Math.random()*QA.length)];
            currentA = task.a;
            speak(`What should I do if ${task.q}?`);
            recGacha.style.display = "block";
        }, 600);
    };

    recGacha.onclick = () => {
        const Rec = window.webkitSpeechRecognition || window.SpeechRecognition;
        currentRec = new Rec();
        currentRec.lang = 'en-US';
        recGacha.innerText = "Listening...";
        recGacha.classList.add('recording');
        currentRec.start();
        currentRec.onresult = (event) => {
            const userSpeech = event.results[0][0].transcript.toLowerCase();
            const isCorrect = userSpeech.includes(currentA.toLowerCase());
            
            document.getElementById('mT').innerText = isCorrect ? "🌟 Gacha Success!" : "❌ Try Again";
            document.getElementById('mM').innerHTML = isCorrect ? "Perfect Answer!" : `You said: "${userSpeech}" <br> Target: ${currentA}`;
            document.getElementById('modalOverlay').style.display = 'flex';
            if(isCorrect) speak("Excellent!");
            stopRec();
        };
        currentRec.onerror = () => stopRec();
    };
</script>

</body>
</html>
